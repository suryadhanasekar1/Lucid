<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0B"/>
      <stop offset="100%" stop-color="#1A1A1F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A7548"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(212,175,55,0.45)"/>
      <stop offset="60%" stop-color="rgba(212,175,55,0.10)"/>
      <stop offset="100%" stop-color="rgba(212,175,55,0)"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.6"/>
  <!-- Compass needle -->
  <polygon points="256,108 280,256 256,232 232,256" fill="url(#gold)"/>
  <polygon points="256,404 232,256 256,280 280,256" fill="#3D3D3A"/>
  <circle cx="256" cy="256" r="12" fill="#D4AF37" stroke="#0A0A0B" stroke-width="3"/>
  <!-- Cardinals -->
  <g fill="#D4AF37" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    <text x="256" y="84">N</text>
    <text x="256" y="448">S</text>
    <text x="430" y="265">E</text>
    <text x="82"  y="265">W</text>
  </g>
</svg>
